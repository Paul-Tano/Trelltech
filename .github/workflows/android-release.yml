name: Android APK

# Compile l'APK sur les serveurs GitHub et le publie dans une Release.
# Déclenchement : push d'un tag "v*" (ex. v2.0.0) ou lancement manuel depuis l'onglet Actions.
# Prérequis : secret de dépôt TRELLO_API_KEY (Settings → Secrets and variables → Actions).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
      EXPO_PUBLIC_TRELLO_REDIRECT_URI: trelltech://
    steps:
      - name: Vérifier la présence de la clé Trello
        run: |
          if [ -z "$EXPO_PUBLIC_TRELLO_API_KEY" ]; then
            echo "::error::Le secret TRELLO_API_KEY est absent (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Nommer l'APK
        id: apk
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "TrellTech-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=TrellTech-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TrellTech-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TrellTech ${{ steps.apk.outputs.version }}
          files: ${{ steps.apk.outputs.file }}
          body: |
            APK Android de TrellTech ${{ steps.apk.outputs.version }}.
            Téléchargez le fichier .apk ci-dessous puis ouvrez-le sur votre téléphone
            (autorisez l'installation depuis des sources inconnues si demandé).
